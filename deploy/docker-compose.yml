# Local development stack. Run from the repo root:
#   docker compose -f deploy/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cacp
      POSTGRES_PASSWORD: cacp
      POSTGRES_DB: cacp
    ports:
      - "5432:5432"
    volumes:
      - cacp_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cacp"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  cacp_pg:
